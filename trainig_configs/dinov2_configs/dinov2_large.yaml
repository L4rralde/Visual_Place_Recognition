backbone_arch: "dinov2_vitl14"

input_config:
  img_size: [224, 224]

backbone_config:
  frozen: true
  return_token: true
  norm_layer: true

agg_config:
  #num_channels from dinov2-large: 1024
  num_clusters: 64
  cluster_dim: 128 # 1024 -> 512 -> 128
  token_dim: 256 # 1024 -> 512 -> 256

max_epochs: 10
