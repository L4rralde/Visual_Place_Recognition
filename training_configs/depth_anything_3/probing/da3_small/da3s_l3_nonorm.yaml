#504 is the resolution used at test time
define: &process_res 252 #This is the largest dimension.

backbone_arch: "da3-small"

input_config:
  img_size: *process_res #Actually, this one is not used at all.

backbone_config:
  frozen: true
  norm_layer: false
  probing_from_layer: 3

agg_config:
  #num_channels from dinov3-base: 768 (Same as dinov2-Base)
  num_clusters: 64
  cluster_dim: 128
  token_dim: 256

max_epochs: 1
