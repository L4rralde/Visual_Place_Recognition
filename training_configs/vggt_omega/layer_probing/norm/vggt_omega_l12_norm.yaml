#define: &process_res 512 #This is the largest dimension.
define: &process_res 368 #Must train with 368. Not achivable with mode balanced using only 16GB VRAM.

backbone_arch: "vggt_omega"

input_config:
  img_size: *process_res #Actually, this one is not used at all.
  mode: "max_size" #default is "balanced"

backbone_config:
  frozen: true
  norm_layer: true
  probing_from_layer: 12
  vggt_omega_checkpoint: "vggt_omega_1b_512.pt"

agg_config:
  #num_channels from dinov2-large
  num_clusters: 64
  cluster_dim: 128
  token_dim: 256

max_epochs: 1
