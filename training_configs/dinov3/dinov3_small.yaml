backbone_arch: "dinov3_vits16"

input_config:
  img_size: [256, 256]

backbone_config:
  num_trainable_blocks: 2
  norm_layer: true
  rope_sincos: true

agg_config:
  #num_channels from dinov3-small: 384 (Same as dinov2-small)
  num_clusters: 64
  cluster_dim: 128 # 384 -> 512 -> 128
  token_dim: 256 # 384 -> 512 -> 256

max_epochs: 8
